<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor de Árvore</title>
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --fundo: #0a0908; --painel: #14110d; --borda: #3a2f22; --ouro: #c8a86a; --texto: #e8dcc0;
    --apagado: #8f8270; --perigo: #d0482a;
    --serif: 'EB Garamond', Georgia, serif; --titulo: 'Cinzel', Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--fundo); color: var(--texto); font-family: var(--serif); font-size: 16px; overflow: hidden; }
  body { display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: 1fr 340px; }
  header { grid-row: 1; grid-column: 1 / 3; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 8px 14px; background: var(--painel); border-bottom: 1px solid var(--borda); }
  header > b { font-family: var(--titulo); color: var(--ouro); letter-spacing: .06em; margin-right: 6px; }
  header label { color: var(--apagado); font-size: 14px; display: flex; align-items: center; gap: 6px; }
  input, select, textarea { font: inherit; color: var(--texto); background: #0d0b09; border: 1px solid var(--borda); border-radius: 4px; padding: 3px 6px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--ouro); }
  input[type=number] { width: 66px; }
  #t-arvore { width: 120px; } #t-nome { width: 150px; }
  button { font: inherit; font-size: 14px; color: var(--texto); background: #221b13; border: 1px solid var(--borda); border-radius: 4px; padding: 4px 10px; cursor: pointer; }
  button:hover { border-color: var(--ouro); }
  button.forte { background: #3a2c17; border-color: var(--ouro); color: #f3e3bd; }
  button.perigo { border-color: #6b2a1c; color: #f0b8a8; margin-top: 14px; }
  #t-soma { font-size: 14px; color: var(--apagado); }
  #t-estado { font-size: 14px; color: var(--apagado); min-width: 90px; }
  #t-estado.sujo { color: #e9b45c; }

  #tela { grid-row: 2; grid-column: 1; position: relative; overflow: hidden; cursor: grab; touch-action: none;
    background-color: #0c0a08;
    background-image: linear-gradient(#18130e 1px, transparent 1px), linear-gradient(90deg, #18130e 1px, transparent 1px),
                      linear-gradient(#251e15 1px, transparent 1px), linear-gradient(90deg, #251e15 1px, transparent 1px); }
  #tela.puxando { cursor: grabbing; }
  #mundo { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #fios { position: absolute; left: -10000px; top: -10000px; width: 20000px; height: 20000px; pointer-events: none; overflow: visible; }
  .fio-linha { stroke: #8a7448; stroke-width: 2; fill: none; }
  .fio.sel .fio-linha { stroke: #f1d48f; stroke-width: 3; }
  .fio.impossivel .fio-linha { stroke: var(--perigo); }
  .fio-alvo { stroke: transparent; stroke-width: 14; pointer-events: stroke; cursor: pointer; }
  .fio-rot { pointer-events: all; cursor: pointer; }
  .fio-rot circle { fill: #0c0a08; stroke: #8a7448; stroke-width: 1.5; }
  .fio.sel .fio-rot circle { stroke: #f1d48f; }
  .fio.impossivel .fio-rot circle { stroke: var(--perigo); }
  .fio-rot text { fill: var(--texto); font-size: 11px; text-anchor: middle; dominant-baseline: central; font-family: var(--serif); }
  .fio-temp { stroke: var(--ouro); stroke-width: 2; stroke-dasharray: 6 5; fill: none; }

  .no { position: absolute; width: 150px; min-height: 60px; padding: 6px 12px 8px 10px; background: #1a150f; border: 1px solid #4a3c2a; border-radius: 6px; cursor: move; user-select: none; box-shadow: 0 2px 8px #0008; }
  .no.sel { border-color: var(--ouro); box-shadow: 0 0 0 2px #c8a86a55, 0 2px 8px #0008; }
  .no-tipo { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--apagado); }
  .no-nome { font-family: var(--titulo); font-size: 14px; color: #f1e6cc; line-height: 1.2; margin: 2px 0; word-break: break-word; }
  .no-pts { font-size: 13px; color: var(--ouro); }
  .tipo-ativa { background: #1f1a11; border-color: #6a5a3c; }
  .tipo-classe { background: #24120c; border-color: #8a3a22; }
  .tipo-classe .no-pts { color: #f08a6a; }
  .tipo-identidade { background: #1c1426; border-color: #8a6ac8; box-shadow: 0 0 12px #8a6ac833, 0 2px 8px #0008; }
  .tipo-identidade .no-pts { color: #c9a8f0; }
  .tipo-identidade2 { background: #261e0c; border: 2px solid #e8c25a; box-shadow: 0 0 16px #e8c25a44, 0 2px 8px #0008; }
  .tipo-identidade2 .no-pts { color: #f3d27a; }
  .no.missao { border-style: dashed; }
  .no.missao .no-pts { color: #9fc3a0; }
  .alca { position: absolute; right: -9px; top: 50%; width: 16px; height: 16px; margin-top: -8px; border-radius: 50%; background: var(--ouro); border: 2px solid #0a0908; cursor: crosshair; }
  .alca:hover { transform: scale(1.3); }

  #painel { grid-row: 2 / 4; grid-column: 2; overflow-y: auto; padding: 12px 16px 24px; background: var(--painel); border-left: 1px solid var(--borda); }
  #painel h2 { font-family: var(--titulo); color: var(--ouro); font-size: 16px; margin: 4px 0 12px; letter-spacing: .05em; }
  #painel h3 { font-family: var(--titulo); font-size: 12px; color: var(--apagado); margin: 16px 0 6px; letter-spacing: .06em; text-transform: uppercase; }
  #painel p { line-height: 1.45; }
  .campo { display: block; margin: 0 0 10px; flex: 1; }
  .campo > span { display: block; font-size: 13px; color: var(--apagado); margin-bottom: 3px; }
  .campo input:not([type=number]), .campo select, .campo textarea { width: 100%; }
  .campo textarea { min-height: 70px; resize: vertical; }
  .linha { display: flex; gap: 12px; }
  .req { display: flex; align-items: center; gap: 6px; margin: 5px 0; font-size: 14px; }
  .req span { flex: 1; }
  .req button { padding: 1px 7px; }
  .ponto { display: flex; gap: 6px; align-items: center; margin: 4px 0; }
  .ponto b { width: 26px; color: var(--apagado); font-size: 13px; font-weight: normal; }
  .ponto input { flex: 1; }
  .vazio { color: var(--apagado); font-size: 14px; margin: 4px 0; }
  .aviso { color: #f0a080; font-size: 14px; }
  .id { font-size: 12px; color: var(--apagado); font-family: Consolas, monospace; word-break: break-all; margin-top: 16px; }
  .ajuda p { color: var(--apagado); font-size: 15px; }
  .ajuda b { color: var(--texto); font-weight: normal; }
  code { font-family: Consolas, monospace; font-size: 13px; color: var(--ouro); }

  footer { grid-row: 3; grid-column: 1; padding: 5px 14px; font-size: 13px; color: var(--apagado); background: var(--painel); border-top: 1px solid var(--borda); }
  #toast { position: fixed; top: 60px; left: calc((100% - 340px) / 2); transform: translateX(-50%); background: #2a2015; border: 1px solid var(--ouro); padding: 6px 14px; border-radius: 4px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 5; }
  #toast.ver { opacity: 1; }
  button.ligado { border-color: var(--ouro); color: #f3e3bd; background: #3a2c17; }
  .bal { margin: 0 0 16px; }
  .bal > span { display: block; font-size: 14px; color: var(--texto); margin-bottom: 4px; }
  .bal > span i { color: var(--apagado); font-style: normal; font-size: 12px; }
  .bal .linha { align-items: center; gap: 8px; }
  .bal input[type=range] { flex: 1; accent-color: var(--ouro); }
  .bal small { display: block; color: var(--apagado); font-size: 13px; line-height: 1.3; margin-top: 3px; }
  .bal-conta { font-size: 13px; color: var(--apagado); border-top: 1px solid var(--borda); padding-top: 8px; }
  .bal-conta b { color: var(--ouro); font-weight: normal; }
</style>
</head>
<body>
<header>
  <b>EDITOR DE ÁRVORE</b>
  <label>Árvore <input id="t-arvore" list="t-lista" spellcheck="false" title="O nome do arquivo: planejamento/arvores/&lt;nome&gt;.json"></label>
  <datalist id="t-lista"></datalist>
  <label>Nome <input id="t-nome"></label>
  <label>Pontos da árvore <input id="t-pontos" type="number" min="0" max="999"></label>
  <span id="t-soma"></span>
  <span style="flex:1"></span>
  <button id="b-novo">+ Quadrinho</button>
  <button id="b-ver">Ver tudo</button>
  <button id="b-desfazer">Desfazer</button>
  <button id="b-balanco" title="Os números do golpe e do vigor do jogador (assets/balanco.json): o jogo local muda na hora">Balanceamento</button>
  <label title="Grava sozinho logo depois de cada mudança; na página dos Caminhos, o jogo local muda na hora"><input type="checkbox" id="t-aovivo"> Ao vivo</label>
  <button id="b-salvar" class="forte">Salvar</button>
  <span id="t-estado"></span>
</header>
<main id="tela"><div id="mundo"><svg id="fios" xmlns="http://www.w3.org/2000/svg"></svg><div id="nos"></div></div></main>
<aside id="painel"></aside>
<footer>Duplo clique no fundo: novo quadrinho · arraste a bolinha dourada até outro quadrinho: ligar · arraste o fundo: mover · roda do mouse: zoom · Del: apagar · Ctrl+Z: desfazer · Ctrl+S: salvar</footer>
<div id="toast"></div>
<script type="module" src="editor-arvore.js"></script>
</body>
</html>
